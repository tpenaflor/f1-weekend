model:
  default: google/gemini-2.5-pro
  provider: vertex
database:
  journal_mode: wal
runtime:
  nofile_soft_limit: 4096
agent:
  max_turns: 150
  verbose: false
  reasoning_effort: medium
  personalities:
    pm:
      name: Product Manager
      system_prompt: You are the Product Manager. Your primary job is to gather requirements
        from the user and write detailed Product Requirement Documents (PRDs) for
        the development team. You do not write code. When you finish writing a PRD,
        always @mention the Lead Developer (Coder) to implement it.
      tools_allow:
        - view_file
    coder:
      name: Technical Architect
      system_prompt: 'You are the Technical Architect. You implement the PRDs written by
        the PM. IMPORTANT: Do NOT write code manually. You MUST use your terminal
        to run the Antigravity CLI to do the coding work. Use the command: `/opt/data/.local/bin/agy
        "your task description here"`. Antigravity will do the coding for you. Once
        the command finishes, @mention the QA Engineer (Tester) to verify the work.'
      tools_allow:
        - run_command
        - view_file
        - list_dir
    tester:
      name: QA Engineer
      system_prompt: You are the QA Engineer. You verify the changes made by the Coder.
        You should run tests, view the modified files, or run the application in the
        terminal to ensure it works correctly. Report any bugs back to the Coder by
        @mentioning them.
      tools_allow:
        - run_command
        - view_file
        - list_dir
        - grep_search
terminal:
  backend: local
  cwd: .
  timeout: 180
  home_mode: auto
  container_cpu: 1
  container_memory: 5120
  container_disk: 51200
  container_persistent: true
  docker_mount_cwd_to_workspace: false
  lifetime_seconds: 300
web:
  backend: nous
browser:
  inactivity_timeout: 120
  extension_control:
    enabled: false
  cloud_provider: nous
tool_loop_guardrails:
  warnings_enabled: true
  hard_stop_enabled: true
  warn_after:
    exact_failure: 2
    same_tool_failure: 3
    idempotent_no_progress: 2
  hard_stop_after:
    exact_failure: 5
    same_tool_failure: 8
    idempotent_no_progress: 5
compression:
  enabled: true
  progress_notices: false
  threshold: 0.5
  target_ratio: 0.2
  protect_last_n: 20
  min_tail_user_messages: 1
  max_attempts: 3
  proactive_prune_tokens: 0
  proactive_prune_min_result_chars: 8000
  proactive_prune_min_reclaim_tokens: 4096
  protect_first_n: 3
  codex_gpt55_autoraise: true
  codex_app_server_auto: native
  codex_responses_native: false
  codex_responses_compact_threshold: 200000
  idle_compact_after_seconds: 0
prompt_caching:
  cache_ttl: 5m
display:
  compact: false
  busy_input_mode: interrupt
  bell_on_complete: false
  show_reasoning: false
  background_process_notifications: concise
  streaming: true
  skin: default
  interim_assistant_messages: true
  tool_progress: all
  cleanup_progress: false
  long_running_notifications: true
  busy_ack_detail: true
dashboard:
  theme: midnight
  basic_auth:
    username: admin
    password_hash: scrypt$16384$8$1$sGfL/SrimiG0KO21TnHRFA==$Df76vnQRXbHlpcGMFfDK8XgINpKk17NQLUaFWhwDnZ0=
tts:
  provider: nous
stt:
  enabled: true
  language: en
  local:
    model: base
  openai:
    model: whisper-1
    language: ''
  provider: nous
memory:
  memory_enabled: true
  user_profile_enabled: true
  memory_char_limit: 2200
  user_char_limit: 1375
  nudge_interval: 10
delegation:
  max_iterations: 250
skills:
  creation_nudge_interval: 15
kanban:
  review_dispatch: true
code_execution:
  timeout: 300
  max_tool_calls: 50
streaming:
  enabled: false
onboarding:
  seen:
    profile_build_offered: true
    busy_input_prompt: true
telemetry:
  shared_metrics:
    enabled: false
updates:
  pre_update_backup: false
  backup_keep: 5
  non_interactive_local_changes: stash
vertex:
  project_id: tron-solutions-503808
  region: us-central1
_config_version: 38
session_reset:
  mode: none
  idle_minutes: 1440
  at_hour: 4
group_sessions_per_user: true
platform_toolsets:
